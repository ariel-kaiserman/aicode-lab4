<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>proxy.py · live traffic</title>
<style>
:root {
  --bg: #f6f6f8; --panel: #ffffff; --fg: #1d1d22; --muted: #6c6c78; --border: #e2e2e8;
  --user: #eef4ff; --user-b: #c6d9ff; --asst: #f4f1ff; --asst-b: #dcd2ff;
  --card: #fbfaf6; --card-b: #e8e0c8; --code: #f0f0f4; --sel: #e6eeff;
  --ok: #1e7f46; --err: #c42b2b; --err-bg: #fdeded; --warn: #a76200; --accent: #3866d8;
  --grey: #8a8a96;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141518; --panel: #1c1d21; --fg: #e5e5ea; --muted: #9797a4; --border: #2d2f35;
    --user: #1a2536; --user-b: #2b4166; --asst: #211d30; --asst-b: #3b3163;
    --card: #1f1e1a; --card-b: #45402f; --code: #25272c; --sel: #22304a;
    --ok: #4cc27a; --err: #ff6f6f; --err-bg: #3a1d1d; --warn: #e2a14a; --accent: #7ea4ff;
    --grey: #777784;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); }
button { font: inherit; color: inherit; }
code, pre, .mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

#app { display: grid; grid-template-columns: 340px minmax(0, 1fr); height: 100vh; }

/* ---- left: exchange list ---- */
#side { display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--panel); min-height: 0; }
#sidehead { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.toprow { display: flex; align-items: center; gap: 10px; }
.conn { font-weight: 600; }
.conn.on { color: var(--ok); }
.conn.off { color: var(--err); }
#filter { font: inherit; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); }
#list { overflow-y: auto; flex: 1; min-height: 0; }
.row { padding: 7px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
.row:hover { background: var(--bg); }
.row.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
.row .l1 { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.row .xid { font-weight: 600; font-family: var(--mono); font-size: 12.5px; min-width: 32px; }
.row .time { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.row .model { font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.row .l1 .badge { margin-left: auto; }
.row .l2 { color: var(--muted); font-size: 12.5px; margin: 2px 0 0 40px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.other { color: var(--grey); padding: 4px 12px; font-size: 12.5px; }
.row.other .model { font-weight: 400; font-family: var(--mono); font-size: 12px; }
.empty-list { padding: 20px 14px; color: var(--muted); }

.badge { font-size: 11.5px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--border); white-space: nowrap; color: var(--muted); }
.badge.live { color: var(--accent); border-color: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
.badge.pending { font-style: italic; }
.badge.err { color: var(--err); border-color: var(--err); }
.badge.sr-end_turn { color: var(--ok); border-color: var(--ok); }
.badge.sr-tool_use { color: var(--accent); }
.badge.sr-max_tokens, .badge.sr-refusal { color: var(--warn); border-color: var(--warn); }
@keyframes pulse { 50% { opacity: .45; } }

/* ---- right: detail ---- */
#main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#dhead { background: var(--panel); border-bottom: 1px solid var(--border); padding: 10px 18px 0; }
#meta .l1 { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; }
#meta .xid { font-weight: 700; font-size: 16px; }
#meta .method { font-weight: 600; font-family: var(--mono); }
#meta .path { font-family: var(--mono); font-size: 13px; word-break: break-all; }
#meta .l2, #meta .l3 { color: var(--muted); margin-top: 2px; }
#meta .l2 b { color: var(--fg); font-weight: 600; }
.status { font-family: var(--mono); font-weight: 600; padding: 0 6px; border-radius: 4px; }
.status.ok { color: var(--ok); } .status.bad { color: var(--err); }
.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--code); border: 1px solid var(--border); color: var(--muted); }
.chip.link { cursor: pointer; color: var(--accent); }
.chip.newconv { color: var(--warn); }
.banner { margin: 8px 0 0; padding: 8px 12px; border-radius: 6px; background: var(--err-bg); color: var(--err); border: 1px solid var(--err); font-weight: 500; white-space: pre-wrap; word-break: break-word; }
#tabs { display: flex; align-items: center; gap: 2px; margin-top: 8px; }
#tabs .tab { border: 0; background: none; padding: 6px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
#tabs .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
#tabs .spacer { flex: 1; }
#follow { border: 1px solid var(--border); background: var(--bg); border-radius: 14px; padding: 2px 12px; cursor: pointer; margin-bottom: 4px; }
#follow.on { color: var(--ok); border-color: var(--ok); }
#drawerBtn { display: none; border: 1px solid var(--border); background: var(--bg); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
#dbody { flex: 1; overflow-y: auto; padding: 14px 18px 60px; min-height: 0; }

.empty { max-width: 620px; margin: 60px auto; color: var(--muted); }
.empty h2 { color: var(--fg); font-weight: 600; }

/* conversation */
.fold { margin: 6px 0; }
.fold > summary { cursor: pointer; padding: 4px 6px; border-radius: 6px; user-select: none; }
.fold > summary:hover { background: var(--code); }
.top-fold > summary { font-weight: 500; }
.divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 16px 0 8px; }
.divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
.divider::before { flex: 0 0 18px; }
.msg { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px 10px; margin: 8px 0; max-width: 980px; }
.msg.role-user { background: var(--user); border-color: var(--user-b); }
.msg.role-assistant { background: var(--asst); border-color: var(--asst-b); }
.msg .role { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
.blocks > * + * { margin-top: 8px; }
.pre { white-space: pre-wrap; word-break: break-word; }
.dim { color: var(--muted); }
.tag { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.tag::before { content: "<"; } .tag::after { content: ">"; }
.md p { margin: 0 0 8px; white-space: pre-wrap; word-break: break-word; }
.md p:last-child { margin-bottom: 0; }
.md ul, .md ol { margin: 4px 0 8px; padding-left: 22px; }
.md h4 { margin: 10px 0 4px; font-size: 14px; }
.md code, .karg, .inline-code { background: var(--code); padding: 1px 4px; border-radius: 4px; }
pre.code, pre.json, pre.out, pre.sys-text { background: var(--code); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin: 4px 0; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
pre.code { white-space: pre; }
pre.code .lang { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.thinking { font-style: italic; color: var(--muted); padding: 4px 8px; border-left: 3px solid var(--asst-b); }
.cursor { display: inline-block; width: .55em; height: 1.05em; vertical-align: text-bottom; background: var(--accent); margin-left: 2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.card { border: 1px solid var(--card-b); background: var(--card); border-radius: 8px; padding: 6px 10px; }
.card.is-error { border-color: var(--err); }
.card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; cursor: pointer; }
.card-head .tname { font-weight: 600; }
.card-head .karg { font-family: var(--mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.card-head .jump { margin-left: auto; font-size: 12px; color: var(--accent); opacity: .7; }
.card-head:hover .jump { opacity: 1; text-decoration: underline; }
.good { color: var(--ok); font-weight: 600; } .bad { color: var(--err); font-weight: 600; }
.more { margin-top: 2px; border: 1px solid var(--border); background: var(--panel); border-radius: 6px; padding: 2px 10px; cursor: pointer; font-size: 12px; }
.partial { opacity: .85; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.sysblock + .sysblock { margin-top: 10px; }
.sys-meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; }
.pin { color: var(--warn); }
.toollist { padding-left: 12px; }
.toollist .fold { margin: 2px 0; }
.waiting { color: var(--muted); font-style: italic; padding: 6px 2px; }

/* raw tabs */
.raw { margin-bottom: 16px; }
.raw-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; font-weight: 600; }
.copy { border: 1px solid var(--border); background: var(--panel); border-radius: 6px; padding: 1px 10px; cursor: pointer; font-size: 12px; font-weight: 400; }
.raw pre { max-height: none; }

#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 6px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: .92; }

/* narrow screens: the list becomes a drawer at the top */
@media (max-width: 899px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  #side { border-right: 0; border-bottom: 1px solid var(--border); }
  #list { display: none; max-height: 45vh; }
  body.drawer #list { display: block; }
  #drawerBtn { display: inline-block; }
  #dhead, #dbody { padding-left: 12px; padding-right: 12px; }
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="sidehead">
      <div class="toprow">
        <span id="conn" class="conn off">○ connecting…</span>
        <span id="session" class="muted small"></span>
        <span class="spacer" style="flex:1"></span>
        <button id="drawerBtn" type="button" title="Show the exchange list">☰ list</button>
      </div>
      <div class="toprow">
        <label class="muted small" for="filter">filter</label>
        <select id="filter">
          <option value="messages">messages only</option>
          <option value="all">all traffic</option>
        </select>
        <span id="count" class="muted small"></span>
      </div>
    </div>
    <div id="list"></div>
  </aside>
  <main id="main">
    <div id="dhead">
      <div id="meta"></div>
      <div id="tabs">
        <button class="tab" data-tab="conv" type="button">Conversation</button>
        <button class="tab" data-tab="req" type="button">Raw request</button>
        <button class="tab" data-tab="resp" type="button">Raw response</button>
        <span class="spacer"></span>
        <button id="follow" class="on" type="button" title="Jump to each new exchange and scroll while it streams">● following live</button>
      </div>
    </div>
    <div id="dbody"></div>
  </main>
</div>
<div id="toast"></div>
<noscript>This dashboard needs JavaScript.</noscript>
<script>
'use strict';
(() => {
// ===== state =================================================================
const S = {
  session: null, keep: 200, proxy: null,
  ex: new Map(),        // id -> exchange (shape from tap_store.Exchange)
  order: [],            // ids, ascending
  maxId: 0,
  selected: null, follow: true,
  filter: 'messages', tab: 'conv',
};
const openState = new Map();   // collapsible key -> open?
const prevCache = new Map();   // exchange id -> previous exchange id in the same conversation, or 0
const D = { list: false, rows: new Set(), detail: false, head: false, resp: false, scroll: false };

const $ = (sel, root = document) => root.querySelector(sel);
const E = {
  list: $('#list'), meta: $('#meta'), body: $('#dbody'), conn: $('#conn'), session: $('#session'),
  filter: $('#filter'), follow: $('#follow'), tabs: $('#tabs'), drawer: $('#drawerBtn'),
  count: $('#count'), toast: $('#toast'),
};

// ===== DOM helpers (all captured text goes in as text nodes) =================
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : String(c));
  }
  return el;
}
const muted = (t) => h('span', { class: 'muted' }, t);
const pretty = (v) => { try { const s = JSON.stringify(v, null, 2); return s === undefined ? String(v) : s; } catch { return String(v); } };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
function fmtTime(iso) { if (!iso) return ''; const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function fmtTok(n) { if (n == null) return '–'; if (n < 1000) return String(n); return (n / 1000).toFixed(n >= 100000 ? 0 : 1) + 'k'; }
function fmtDur(ms) { if (ms == null || isNaN(ms)) return '…'; return ms < 1000 ? `${ms}ms` : `${(ms / 1000).toFixed(1)}s`; }
function fmtSize(n) { return n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(1)} MB`; }
function fmtChars(n) { return n >= 1000 ? `${(n / 1000).toFixed(1)}k chars` : `${n} chars`; }
function oneLine(s, max = 90) { s = String(s).replace(/\s+/g, ' ').trim(); return s.length > max ? s.slice(0, max) + '…' : s; }
function plural(n, w) { return `${n} ${w}${n === 1 ? '' : 's'}`; }
function shortModel(m) { if (!m) return ''; const x = /(opus|sonnet|haiku|fable)/i.exec(m); return x ? x[1].toLowerCase() : m.replace(/^claude-/, '').slice(0, 16); }

function collapsible(key, summary, render, defOpen = false, cls = '') {
  const d = h('details', { class: 'fold ' + cls }, h('summary', null, summary));
  let filled = false;
  d._fill = () => { if (!filled) { filled = true; const c = render(); if (c) d.append(c); } };
  if (key && openState.has(key) ? openState.get(key) : defOpen) { d.open = true; d._fill(); }
  d.addEventListener('toggle', () => { if (d.open) d._fill(); if (key) openState.set(key, d.open); });
  return d;
}

let toastTimer = 0;
function toast(msg) { E.toast.textContent = msg; E.toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => E.toast.classList.remove('show'), 2500); }

async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = h('textarea'); ta.value = text; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  btn.textContent = 'copied ✓'; setTimeout(() => { btn.textContent = 'copy'; }, 1200);
}

// ===== exchange helpers ======================================================
const reqBody = (ex) => ex && ex.request && ex.request.body;
const respMsg = (ex) => ex && ex.response && ex.response.message;
const isConv = (ex) => ex && ex.kind === 'messages' && reqBody(ex) && Array.isArray(reqBody(ex).messages);
const visible = (ex) => S.filter === 'all' || ex.kind === 'messages';
const tabFor = (ex) => (isConv(ex) ? S.tab : (S.tab === 'conv' ? 'resp' : S.tab));
function newestVisibleId() { for (let i = S.order.length - 1; i >= 0; i--) { const ex = S.ex.get(S.order[i]); if (ex && visible(ex)) return ex.id; } return null; }
function errText(ex) {
  const err = ex.response && ex.response.error;
  if (err) return (err.type && err.type !== 'error' ? err.type + ': ' : '') + (err.message || '');
  if (ex.status >= 400) return `HTTP ${ex.status}`;
  return '';
}
function eachBlock(messages, fn) {
  for (const m of messages || []) if (m && Array.isArray(m.content)) for (const b of m.content) if (b && fn(b)) return true;
  return false;
}

// ----- 7.2: find the earlier request of the same conversation ---------------
function stable(v) { return JSON.stringify(v, (k, val) => (k === 'cache_control' ? undefined : val)) || ''; }
function hash(s) { let x = 0x811c9dc5; for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 0x01000193); } return (x >>> 0).toString(36) + ':' + s.length; }
const infoCache = new WeakMap();   // request body -> { sysKey, hashes }
function convInfo(ex) {
  const b = reqBody(ex);
  let c = infoCache.get(b);
  if (!c) { c = { sysKey: (b.model || '') + '|' + hash(stable(b.system)), _h: null }; infoCache.set(b, c); }
  if (!c._h) c._h = b.messages.map((m) => hash(stable(m)));
  return c;
}
function sysKeyOf(ex) { const b = reqBody(ex); const c = infoCache.get(b); return c ? c.sysKey : convInfo(ex).sysKey; }
function findPrev(ex) {
  if (!isConv(ex)) return null;
  if (prevCache.has(ex.id)) { const p = S.ex.get(prevCache.get(ex.id)); if (p || prevCache.get(ex.id) === 0) return p || null; }
  const key = sysKeyOf(ex);
  let found = 0;
  for (let i = S.order.indexOf(ex.id) - 1; i >= 0 && !found; i--) {
    const p = S.ex.get(S.order[i]);
    if (!isConv(p) || sysKeyOf(p) !== key) continue;
    const a = convInfo(p)._h, b = convInfo(ex)._h;
    if (a.length > b.length) continue;
    let ok = true;
    for (let j = 0; j < a.length; j++) if (a[j] !== b[j]) { ok = false; break; }
    if (ok) found = p.id;
  }
  prevCache.set(ex.id, found);
  return found ? S.ex.get(found) : null;
}

// ===== Markdown (input is untrusted: every piece is escaped, only fixed tags emitted) =====
function inline(s) {
  return s.split(/(`[^`\n]+`)/).map((part, i) =>
    i % 2 ? '<code>' + esc(part.slice(1, -1)) + '</code>'
          : esc(part).replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')).join('');
}
function markdown(text) {
  const lines = String(text).split('\n'), out = [];
  let para = [], list = null;
  const flushPara = () => { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.tag}>` + list.items.map((x) => '<li>' + inline(x) + '</li>').join('') + `</${list.tag}>`); list = null; } };
  for (let i = 0; i < lines.length;) {
    const line = lines[i];
    const fence = /^\s*```(.*)$/.exec(line);
    if (fence) {
      flushPara(); flushList();
      const buf = []; i++;
      while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++;
      const lang = fence[1].trim();
      out.push('<pre class="code">' + (lang ? '<span class="lang">' + esc(lang) + '</span>' : '') + '<code>' + esc(buf.join('\n')) + '</code></pre>');
      continue;
    }
    const li = /^\s*(?:[-*+]|(\d+)[.)])\s+(.*)$/.exec(line);
    if (li) {
      flushPara();
      const tag = li[1] ? 'ol' : 'ul';
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push(li[2]); i++; continue;
    }
    const hd = /^#{1,6}\s+(.*)$/.exec(line);
    if (hd) { flushPara(); flushList(); out.push('<h4>' + inline(hd[1]) + '</h4>'); i++; continue; }
    if (!line.trim()) { flushPara(); flushList(); i++; continue; }
    flushList(); para.push(line); i++;
  }
  flushPara(); flushList();
  return out.join('');
}

// ===== block renderers (7.3) =================================================
const KEY_ARG = { Bash: 'command', Read: 'file_path', Edit: 'file_path', MultiEdit: 'file_path', Write: 'file_path',
  NotebookEdit: 'notebook_path', Grep: 'pattern', Glob: 'pattern', WebFetch: 'url', WebSearch: 'query',
  Task: 'description', Agent: 'description', Skill: 'skill', TodoWrite: 'todos' };
function argText(v) {
  if (Array.isArray(v)) return plural(v.length, 'item');
  v = String(v); const first = v.split('\n')[0];
  return first.length > 160 ? first.slice(0, 160) + '…' : first !== v ? first + ' …' : first;
}
function keyArg(name, input) {
  if (!input || typeof input !== 'object') return '';
  let v = KEY_ARG[name] ? input[KEY_ARG[name]] : undefined;
  if (v == null) for (const x of Object.values(input)) if (typeof x === 'string') { v = x; break; }
  return v == null ? '' : argText(v);
}
function partialKeyArg(name, partial) {
  const k = KEY_ARG[name]; if (!k || !partial) return '';
  const m = new RegExp('"' + k + '"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)').exec(partial);
  if (!m) return '';
  let s = m[1]; try { s = JSON.parse('"' + s.replace(/\\$/, '') + '"'); } catch { /* keep raw */ }
  return argText(s);
}

function renderContent(content, role, ctx, key) {

function touch(id, ended) {
  D.rows.add(id);
  if (id === S.selected) {
    const ex = S.ex.get(id);
    D.head = true;
    if (tabFor(ex) === 'conv') D.resp = true; else if (ended) D.detail = true;
  }
  mark();
}
function apply(t, d) {
  if (t === 'exchange_start') {
    if (S.ex.has(d.id)) return;
    S.ex.set(d.id, d); insertId(d.id); S.maxId = Math.max(S.maxId, d.id); trim();
    if (S.follow && visible(d)) { S.selected = d.id; D.detail = true; }
    D.list = true; mark();
    return;
  }
  const ex = S.ex.get(d.id);
  if (!ex) { if (d.id > S.maxId) refetchSoon(); return; }   // unseen id: resync; older ids were evicted
  if (d.seq <= ex.seq) return;                               // already in the snapshot
  if (t === 'exchange_end') {
    d.request = ex.request;                                  // unchanged; keep the parsed copy (and its caches)
    S.ex.set(d.id, d); touch(d.id, true);
    return;
  }
  if (d.seq !== ex.seq + 1) { refetchSoon(); return; }        // a gap: resync
  ex.seq = d.seq;
  const resp = ex.response || (ex.response = {});
  switch (t) {
    case 'response_start':
      ex.status = d.status; ex.state = d.state; ex.response_at = d.response_at; resp.headers = d.headers; break;
    case 'message_start':
      resp.message = d.message; ensureMsg(resp); break;
    case 'block_start': {
      const b = Object.assign({}, d.block || { type: d.type });
      if (/tool_use$/.test(b.type || '')) b._partial = '';
      ensureMsg(resp).content[d.index] = b; break;
    }
    case 'block_delta': {
      const b = blockAt(resp, d.index);
      if (d.delta_type === 'text') b.text = (b.text || '') + d.text;
      else if (d.delta_type === 'thinking') b.thinking = (b.thinking || '') + d.text;
      else if (d.delta_type === 'input_json') b._partial = (b._partial || '') + d.text;
      break;
    }
    case 'block_stop': {
      const b = blockAt(resp, d.index);
      if ('input' in d) b.input = d.input;
      delete b._partial; break;
    }
    case 'message_delta': {
      const m = ensureMsg(resp);
      m.stop_reason = d.stop_reason; m.stop_sequence = d.stop_sequence;
      m.usage = Object.assign(m.usage || {}, d.usage || {}); break;
    }
  }
  touch(d.id, false);
}
function applySnapshot(j) {
  if (j.session_started_at !== S.session) {   // first load, or the proxy restarted
    openState.clear(); S.selected = null;
    if (S.session) toast('New proxy session');
    if (!S.follow) setFollow(true);
  }
  S.session = j.session_started_at; S.keep = j.keep || 200; S.proxy = j.proxy || null;
  S.ex = new Map(); S.order = []; S.maxId = 0; prevCache.clear();
  for (const ex of j.exchanges) { S.ex.set(ex.id, ex); S.order.push(ex.id); S.maxId = Math.max(S.maxId, ex.id); }
  if (S.follow || !S.ex.has(S.selected)) S.selected = newestVisibleId();
  E.session.textContent = 'session ' + fmtTime(S.session);
  renderedId = null;
  D.list = D.detail = true; D.scroll = true; mark();
}

let es = null, snapGen = 0, buffered = null, refetchTimer = 0;
const EVENT_TYPES = ['exchange_start', 'response_start', 'message_start', 'block_start', 'block_delta', 'block_stop', 'message_delta', 'exchange_end'];
function setConn(on) { E.conn.className = 'conn ' + (on ? 'on' : 'off'); E.conn.textContent = on ? '● live' : '○ disconnected'; }
function connect() {
  es = new EventSource('/events');
  for (const t of EVENT_TYPES) es.addEventListener(t, (e) => {
    let d; try { d = JSON.parse(e.data); } catch { return; }
    if (buffered) buffered.push([t, d]); else apply(t, d);
  });
  es.onopen = () => { setConn(true); loadSnapshot(); };
  es.onerror = () => {
    setConn(false);
    if (es.readyState === EventSource.CLOSED) { es.close(); setTimeout(connect, 2000); }  // the browser gave up; we don't
  };
}
async function loadSnapshot() {
  const gen = ++snapGen;
  if (!buffered) buffered = [];    // hold live events until the snapshot is in
  try {
    const r = await fetch('/api/exchanges', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (gen !== snapGen) return;
    applySnapshot(j);
    const q = buffered; buffered = null;
    for (const [t, d] of q) apply(t, d);
  } catch (e) {
    if (gen !== snapGen) return;
    buffered = null; console.warn('snapshot failed', e); refetchSoon(1500);
  }
}
function refetchSoon(ms = 250) { clearTimeout(refetchTimer); refetchTimer = setTimeout(loadSnapshot, ms); }

// ===== jumping between tool_use and tool_result ==============================
function jumpTo(exId, selector, foldKey) {
  setFollow(false);
  if (isConv(S.ex.get(exId))) S.tab = 'conv';
  if (S.selected !== exId) { if (S.selected != null) D.rows.add(S.selected); D.rows.add(exId); S.selected = exId; }
  renderedId = null; renderDetail(); mark();
  let el = E.body.querySelector(selector);
  if (!el && foldKey) { openState.set(foldKey, true); renderDetail(); el = E.body.querySelector(selector); }
  if (!el) { toast('Matching block not found.'); return; }
  for (let p = el.parentElement; p; p = p.parentElement) if (p.tagName === 'DETAILS' && !p.open) { p.open = true; p._fill && p._fill(); }
  el.scrollIntoView({ block: 'center' });
  el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1700);
}
const resultIn = (ex, id) => isConv(ex) && eachBlock(reqBody(ex).messages, (b) => b.type === 'tool_result' && b.tool_use_id === id);
const useInReq = (ex, id) => isConv(ex) && eachBlock(reqBody(ex).messages, (b) => b.id === id && /tool_use$/.test(b.type || ''));
const useInResp = (ex, id) => !!respMsg(ex) && eachBlock([respMsg(ex)], (b) => b.id === id && /tool_use$/.test(b.type || ''));
function jumpToResult(id, ctx) {
  if (!id) return;
  const sel = `[data-tres="${CSS.escape(id)}"]`;
  for (const xid of S.order) {
    if (xid < ctx.exId || (xid === ctx.exId && ctx.section === 'resp')) continue;
    if (resultIn(S.ex.get(xid), id)) return jumpTo(xid, sel, xid + ':earlier');
  }
  toast('No tool_result for this call yet.');
}
function jumpToUse(id, ctx) {
  if (!id) return;
  const sel = `[data-tuse="${CSS.escape(id)}"]`;
  const here = S.ex.get(ctx.exId);
  if (ctx.section === 'earlier' && useInReq(here, id)) return jumpTo(ctx.exId, sel, ctx.exId + ':earlier');
  for (let i = S.order.length - 1; i >= 0; i--) {
    const xid = S.order[i];
    if (xid < ctx.exId && useInResp(S.ex.get(xid), id)) return jumpTo(xid, '#resp ' + sel);
  }
  if (useInReq(here, id)) return jumpTo(ctx.exId, sel, ctx.exId + ':earlier');
  toast('The matching tool_use is no longer retained.');
}

// ===== controls ==============================================================
E.filter.addEventListener('change', () => {
  S.filter = E.filter.value;
  if (S.follow) { const id = newestVisibleId(); if (id != null && id !== S.selected) { S.selected = id; D.detail = true; } }
  if (S.selected == null) D.detail = true;
  D.list = true; mark();
});
E.tabs.addEventListener('click', (e) => {
  const b = e.target.closest('.tab'); if (!b) return;
  S.tab = b.dataset.tab; renderedId = null; D.detail = true; mark();
});
E.follow.addEventListener('click', () => setFollow(!S.follow));
E.drawer.addEventListener('click', () => document.body.classList.toggle('drawer'));
// Scrolling up (wheel, keys, scrollbar drag, touch) leaves follow mode.
const nearBottom = () => E.body.scrollHeight - E.body.scrollTop - E.body.clientHeight < 40;
let dragging = false;
E.body.addEventListener('wheel', (e) => { if (e.deltaY < 0 && S.follow) setFollow(false); }, { passive: true });
E.body.addEventListener('mousedown', (e) => { if (e.offsetX >= E.body.clientWidth) dragging = true; });
window.addEventListener('mouseup', () => { dragging = false; });
E.body.addEventListener('scroll', () => { if (dragging && S.follow && !nearBottom()) setFollow(false); });
E.body.addEventListener('touchmove', () => requestAnimationFrame(() => { if (S.follow && !nearBottom()) setFollow(false); }), { passive: true });
window.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input, select, textarea')) return;
  if (['PageUp', 'ArrowUp', 'Home'].includes(e.key) && S.follow) setFollow(false);
});
// keep the "elapsed" counter in the header moving while a response is open
setInterval(() => { const ex = S.ex.get(S.selected); if (ex && !ex.ended_at) { D.head = true; mark(); } }, 500);

D.detail = D.list = true; mark();
connect();
})();
</script>
